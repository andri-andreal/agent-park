[package]
name = "park3d"
version = "0.1.0"
description = "Agent Park in 3D"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Linux notifies through notify-send; Windows and macOS through this plugin.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-notification = "2"
