name: Packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
        working-directory: park3d
      - run: pnpm tauri build --bundles deb
        working-directory: park3d
      - uses: actions/upload-artifact@v4
        with:
          name: agent-park-linux-deb-x86_64
          path: park3d/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - run: pnpm tauri build --bundles appimage
        working-directory: park3d
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: agent-park-linux-appimage-x86_64
          path: park3d/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
        working-directory: park3d
      # tauri.windows.conf.json picks the per-user NSIS installer. Python 3 and
      # `pip install psutil` are runtime requirements, as Python 3 is on Linux.
      - run: pnpm tauri build --bundles nsis
        working-directory: park3d
      - uses: actions/upload-artifact@v4
        with:
          name: agent-park-windows-x86_64
          path: park3d/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
